name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web 의존성 설치
        working-directory: web
        run: npm ci

      # mods.json 스키마와 의존 관계는 astro.config.mjs 가 빌드 전에 검사한다.
      # 테스트는 설치 스크립트가 ASCII 로만 나오는지, 모든 모드가 들어가는지 본다.
      - name: 테스트
        working-directory: web
        run: npm test

      - name: 빌드
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
